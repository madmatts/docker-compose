version: "3.8"

services:

  nexus:
      image: sonatype/nexus3:latest
      container_name: nexus
      ports:
        - "8081:8081"
      volumes:
        - C:/Users/mateu/Programing/docker/nexus-data:/nexus-data
      restart: unless-stopped
      environment:
        NEXUS_ROOT_PASSWORD: changeme123
  teamcity-server:
    image: jetbrains/teamcity-server:latest
    container_name: teamcity-server
    ports:
      - "8111:8111"
    environment:
      - TEAMCITY_SERVER_MEM_OPTS=-Xms1g -Xmx2g
      - TEAMCITY_PUBLIC_URL=http://localhost:8111
    volumes:
      - C:/Users/mateu/Programing/docker/team-city-compose/server/data:/data/teamcity_server/datadir
      - C:/Users/mateu/Programing/docker/team-city-compose/server/logs:/opt/teamcity/logs
    restart: unless-stopped
    networks:
      - teamcity

  teamcity-agent:
    image: jetbrains/teamcity-agent:latest
    container_name: teamcity-agent-1
    user: root
    depends_on:
      - teamcity-server
    environment:
      - SERVER_URL=http://teamcity-server:8111
      - AGENT_NAME=local-docker-agent
    volumes:
      - C:/Users/mateu/Programing/docker/team-city-compose/agent/data:/data/teamcity_agent
      - C:/Users/mateu/Programing/docker/team-city-compose/agent/data/work:/data:/opt/buildagent/work
      - C:/Users/mateu/Programing/docker/team-city-compose/agent/data/temp:/data:/opt/buildagent/temp
      # Optional: Uncomment if you want Docker builds inside the agent
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - teamcity

  # --- NOWY AGENT DLA VUE.JS ---
  teamcity-agent-vue:
    # Zamiast 'image' używamy 'build', aby zbudować obraz z lokalnego Dockerfile
    build: .
    stdin_open: true
    tty: true
    container_name: teamcity-agent-vue # Nowa, unikalna nazwa kontenera
    user: root # Uruchamiamy jako root, aby mieć uprawnienia do instalacji
    depends_on:
      - teamcity-server
    environment:
      - SERVER_URL=http://teamcity-server:8111
      - AGENT_NAME=vue-docker-agent # Nowa, unikalna nazwa agenta widoczna w TeamCity
    volumes:
      # BARDZO WAŻNE: Nowy, osobny katalog dla konfiguracji tego agenta!
      - C:/Users/mateu/Programing/docker/team-city-compose/agent-vue/data:/data:/data/teamcity_agent
      - C:/Users/mateu/Programing/docker/team-city-compose/agent-vue/data/temp:/data:/opt/buildagent/temp
      - C:/Users/mateu/Programing/docker/team-city-compose/agent-vue/data/work:/data:/opt/buildagent/work
      - "//./pipe/docker_engine:/var/run/docker.sock"
    restart: unless-stopped
    privileged: true
    networks:
      - teamcity

networks:
  teamcity:
    driver: bridge